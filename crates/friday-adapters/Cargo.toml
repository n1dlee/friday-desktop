[package]
name = "friday-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
friday-core.workspace = true
friday-engine.workspace = true
hound = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "multipart", "stream"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
secrecy = "0.10.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
audioadapter-buffers = "5.1"
rubato = "5.1.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
audioadapter-buffers = "5.1"
rubato = "5.1.0"
tokio-util.workspace = true
cpal = "0.18.2"
rtrb = "0.4.1"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Foundation", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
    "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
windows-future = "0.3.2"

name: Friday Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  core-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p friday-core -p friday-engine -p friday-adapters --all-targets -- -D warnings
      - run: cargo test --locked -p friday-core -p friday-engine -p friday-adapters
      - name: Build and test the panel
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npx --no-install playwright-core install --with-deps chromium
          npm run test:ui

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Bundle frontend assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo clippy --locked --workspace --all-targets --features friday-desktop/custom-protocol -- -D warnings
      - run: cargo test --locked --workspace --features friday-desktop/custom-protocol
      - name: Check the supported Rust baseline
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 check --locked --workspace --all-targets --features friday-desktop/custom-protocol
      - name: Build unsigned installer
        working-directory: apps/desktop
        run: npm run tauri -- build --ci --debug --bundles nsis --target x86_64-pc-windows-msvc -- --locked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Friday-Windows-x64-unsigned
          path: target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe
          if-no-files-found: error

[package]
name = "friday-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[target.'cfg(windows)'.dependencies]
friday-adapters.workspace = true
friday-core.workspace = true
friday-engine.workspace = true
reqwest = { version = "0.13.5", default-features = false }
secrecy = "0.10.3"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.7", default-features = false, features = ["wry", "tray-icon", "compression", "common-controls-v6"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "registry"] }
uuid.workspace = true

[lints]
workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
